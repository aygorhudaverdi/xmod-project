# Remote mode: local Prometheus scraping the hosted app on Render (docker-compose.remote.yml).
# The local stack keeps using observability/prometheus.yml (target app:3000).
# Each scrape is an HTTP request, so it keeps the free Render service awake and uses its monthly instance hours.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: xmod
    scheme: https
    metrics_path: /metrics
    scrape_interval: 30s
    # A free instance can take tens of seconds to wake from a cold start.
    scrape_timeout: 20s
    static_configs:
      - targets: ["xmod-lab.onrender.com"]
        labels:
          service: xmod-lab
          environment: render
