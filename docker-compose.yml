# Local observability stack: app + Prometheus + Grafana (+ optional k6 load generator).
#   docker compose up -d --build                 app :3000, Prometheus :9090, Grafana :3001
#   docker compose --profile perf run --rm k6    run perf/load.js, streaming k6 metrics into Prometheus
#   docker compose down -v
services:
  app:
    build: .
    image: xmod-lab:local
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
      # lets k6 push its own metrics (experimental-prometheus-rw output)
      - --web.enable-remote-write-receiver
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - app

  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/xmod.json
      # Local-only stack. Set GRAFANA_ADMIN_PASSWORD in your shell to override Grafana's default.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

  k6:
    image: grafana/k6:2.2.0
    profiles: ["perf"]
    working_dir: /work
    command: ["run", "-o", "experimental-prometheus-rw", "perf/${K6_SCRIPT:-load.js}"]
    environment:
      BASE_URL: http://app:3000
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_TREND_STATS: "p(95),p(99),avg"
    volumes:
      - ./perf:/work/perf
    depends_on:
      - app
      - prometheus

volumes:
  prometheus-data:
