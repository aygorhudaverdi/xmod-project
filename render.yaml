# Render Blueprint: https://render.com/docs/blueprint-spec
# Render injects PORT (default 10000); the server and the Docker HEALTHCHECK both honor it.
services:
  - type: web
    name: xmod-lab
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
